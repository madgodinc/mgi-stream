<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>mgi-stream pet</title>
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 500; src: url(/fonts/Unbounded-500-cyrillic.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491; }
  @font-face { font-family: 'Unbounded'; font-weight: 500; src: url(/fonts/Unbounded-500-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: 'Manrope'; font-weight: 600; src: url(/fonts/Manrope-600-cyrillic.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491; }
  @font-face { font-family: 'Manrope'; font-weight: 600; src: url(/fonts/Manrope-600-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url(/fonts/JetBrainsMono-600-cyrillic.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491; }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url(/fonts/JetBrainsMono-600-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }

  :root {
    --c1: #5dffc0; --c2: #18b58a; --c3: #25f4ee;
    --ink: #f7f3ff; --dim: #c4bdd8; --ok: #25f4ee; --no: #ff3d6e;
    --paper: #fffaf3; --paper-ink: #2a1630;
    --settle: cubic-bezier(.16, 1, .3, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; height: 100vh; }
  body {
    color: var(--ink); font: 600 16px/1.3 'Manrope', sans-serif;
    display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center;
    padding: 14px 18px 16px; text-shadow: 0 2px 10px rgba(0, 0, 0, .85);
  }
  body.win { -webkit-app-region: drag; }
  body.bg-green { background: #00ff00; text-shadow: none; }
  body.bg-dark { background: #0b0a09; }
  .mono { font: 600 12px/1.2 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }

  /* ── the stage: bubble over the slime ── */
  #stage { position: relative; width: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #home { position: relative; flex: none; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

  /* The cloud: paper-white, dark ink, readable on green, black or the game. */
  #bubble {
    position: relative; z-index: 2; max-width: min(560px, 94%); margin-bottom: 6px;
    padding: 14px 20px 15px; border-radius: 26px;
    background: var(--paper); color: var(--paper-ink); text-shadow: none;
    font: 600 21px/1.28 'Manrope', sans-serif; white-space: pre-line; text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 -3px 0 rgba(0, 0, 0, .06);
    opacity: 0; transform: translateY(10px) scale(.92); transform-origin: 50% 100%;
    transition: opacity .25s ease, transform .45s var(--settle);
  }
  #bubble.on { opacity: 1; transform: none; }
  /* a speech tail */
  #bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -12px; width: 24px; height: 24px; margin-left: -12px;
    background: var(--paper); border-radius: 0 0 6px 0; transform: rotate(45deg);
  }
  /* a thought: puffs instead of a tail, softer ink */
  #bubble.thought { color: #5a4466; font-style: normal; border-radius: 40px; }
  #bubble.thought::after { width: 16px; height: 16px; bottom: -20px; margin-left: -26px; border-radius: 50%; transform: none; }
  #bubble.thought::before {
    content: ''; position: absolute; left: 50%; bottom: -34px; width: 10px; height: 10px; margin-left: -38px;
    background: var(--paper); border-radius: 50%;
  }
  #bubble b { color: #c2185b; }

  /* reactions floating out of the jelly */
  .p { position: absolute; font-size: 30px; line-height: 1; will-change: transform, opacity; animation: float 1.9s var(--settle) forwards; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
  @keyframes float {
    0% { opacity: 0; transform: translate(0, 0) scale(.4) rotate(0); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(var(--r)); }
  }

  /* ── the track under the slime ── */
  #track { width: min(560px, 100%); display: none; margin-top: 4px; }
  #track.on { display: block; animation: rise .6s var(--settle) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  #who { color: var(--c3); margin-bottom: 4px; text-align: center; }
  #title { font: 500 19px/1.22 'Unbounded', sans-serif; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #time { display: flex; align-items: center; gap: 10px; margin-top: 8px; color: var(--dim); }
  #bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .2); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--c1), var(--c2)); }
  #next { margin-top: 6px; color: var(--c3); text-align: center; display: none; font-size: 12px; }
  #next.on { display: block; }
  #next span { color: var(--ink); text-transform: none; letter-spacing: 0; font-family: 'Manrope', sans-serif; font-size: 16px; }
  body.bg-green #title, body.bg-green #next span { color: #101010; }
  body.bg-green #who, body.bg-green #next { color: #003b3a; }

  /* order confirmations, small, top left */
  #notes { position: absolute; left: 16px; top: 12px; display: flex; flex-direction: column; gap: 4px; max-width: 70%; font-size: 14px; }
  .note { animation: note-in .5s var(--settle) both; }
  .note b { color: var(--c3); }
  .note.no b { color: #ff9ab4; }
  .note .why { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .note.out { animation: note-out .5s ease both; }
  @keyframes note-in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes note-out { to { opacity: 0; transform: translateX(-12px); } }

  /* ── the piggy bank, beside the slime ── */
  #jar {
    position: absolute; right: 0; bottom: 6px; z-index: 1; width: clamp(78px, 21vw, 136px);
    display: none; flex-direction: column; align-items: center; gap: 4px;
  }
  #jar.on { display: flex; animation: rise .6s var(--settle) both; }
  .jar__glass { display: block; }
  .jar__cap { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.15; max-width: 160px; }
  .jar__name { font: 500 14px/1.15 'Unbounded', sans-serif; overflow-wrap: anywhere; }
  .jar__count { font: 600 13px/1.2 'JetBrains Mono', monospace; color: #ffd66b; letter-spacing: .04em; }
  #jar.jar--full .jar__count { animation: brag 1.4s var(--settle) both; }
  @keyframes brag { 0% { transform: scale(1); } 20% { transform: scale(1.35); color: #fff3b0; } 100% { transform: scale(1); } }
  body.bg-green .jar__name { color: #101010; }
  body.bg-green .jar__count { color: #6b3d00; }

  #video, #thumbImg { display: none; }
</style>
</head>
<body>

<div id="notes"></div>

<div id="stage">
  <div id="bubble"></div>
  <div id="home"><div id="fx"></div></div>
  <div id="jar"></div>
</div>

<div id="track">
  <div id="who" class="mono"></div>
  <div id="title"></div>
  <div id="time" class="mono"><span id="pos">0:00</span><div id="bar"><div id="fill"></div></div><span id="dur">0:00</span></div>
  <div id="next" class="mono"></div>
</div>

<video id="video" muted playsinline></video>
<img id="thumbImg" alt="">

<script type="module">
import { createSlime } from "/slime.js";
import { createJar } from "/jar.js";

const q = new URLSearchParams(location.search);
if (q.has("win")) document.body.classList.add("win");
if (q.get("bg") === "green" || q.get("bg") === "dark") document.body.classList.add("bg-" + q.get("bg"));

const T = {
  ru: {
    ordered: "заказ", next: "следующий",
    queued: "в очереди", pending: "ждёт одобрения стримера",
    reason: {
      empty: "после команды нужно название трека", noSub: "заказ музыки сейчас выключен",
      bannedUser: "заказы закрыты", tier: "заказ только для своих", perViewer: "лимит заказов на зрителя",
      full: "очередь полная", bannedTrack: "этот трек запрещён", bannedWord: "запрещённое слово",
      duplicate: "уже в очереди", server: "$1", rules: "$1", download: "не скачалось",
    },
  },
  en: {
    ordered: "request", next: "next",
    queued: "queued", pending: "waiting for the streamer",
    reason: {
      empty: "add a track name after the command", noSub: "music requests are off right now",
      bannedUser: "requests are closed", tier: "requests are for regulars", perViewer: "request limit reached",
      full: "the queue is full", bannedTrack: "this track is banned", bannedWord: "banned word",
      duplicate: "already queued", server: "$1", rules: "$1", download: "download failed",
    },
  },
};
let t = T.ru;

const COLORS = {
  mint: ["#5dffc0", "#18b58a"],
  pink: ["#ff8ac8", "#ff3d8b"],
  violet: ["#c09bff", "#6d3dff"],
  sun: ["#ffd84d", "#ff8a3d"],
  sky: ["#86ddff", "#3d7bff"],
};
// what the core's moods look like on the jelly
const FACE = { idle: "neutral", happy: "happy", ecstatic: "excited", love: "love", surprised: "surprised", dance: "happy", sleep: "sleepy" };
const FX = { hearts: ["💖", "💗", "💕", "❤️"], coins: ["🪙", "💎", "✨", "🌟"], stars: ["⭐", "✨", "🌟"] };

const $ = (id) => document.getElementById(id);
const video = $("video");
const thumb = $("thumbImg");
let cfg = { enabled: true, color: "mint" };
let current = null;
let target = { position: 0, paused: false, at: 0 };
let base = "neutral"; // the mood it returns to: neutral, happy while music plays, sleepy
let moodTimer = 0;
let slime = null;
let scale = 1;

const clock = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

// ── the player inside the jelly ──────────────────────────────────────────────

let screenAlpha = 0;
function inside(ctx, { cx, cy, bw, bh, t: time }) {
  const want = current ? 1 : 0;
  screenAlpha += (want - screenAlpha) * 0.08;
  if (screenAlpha < 0.02) return;
  const w = bw * 1.3;
  const h = (w * 9) / 16;
  const x = cx - w / 2;
  const y = cy + bh * 0.3 - h / 2;
  const r = 12;
  ctx.globalAlpha = screenAlpha;
  // the bezel: a darker pocket in the jelly
  ctx.beginPath();
  ctx.roundRect(x - 5, y - 5, w + 10, h + 10, r + 4);
  ctx.fillStyle = "rgba(10, 6, 20, .55)";
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.clip();
  ctx.fillStyle = "#06040c";
  ctx.fillRect(x, y, w, h);
  const pic = current?.video && video.readyState >= 2 ? video : thumb.complete && thumb.naturalWidth ? thumb : null;
  if (pic) {
    const pw = pic.videoWidth || pic.naturalWidth;
    const ph = pic.videoHeight || pic.naturalHeight;
    // cover the screen; a still cover drifts slowly so it does not look frozen
    const k = Math.max(w / pw, h / ph) * (pic === thumb ? 1.08 + Math.sin(time * 0.3) * 0.04 : 1);
    ctx.drawImage(pic, cx - (pw * k) / 2, y + h / 2 - (ph * k) / 2, pw * k, ph * k);
  }
  if (current && !current.video) {
    // an audio track: a little equaliser over the cover
    const bars = 9;
    for (let i = 0; i < bars; i++) {
      const v = target.paused ? 0.1 : 0.25 + 0.75 * Math.abs(Math.sin(time * (2.2 + i * 0.37) + i));
      const bwid = w / (bars * 1.8);
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillRect(x + w * 0.1 + i * bwid * 1.8 * 0.9, y + h - 8 - v * h * 0.35, bwid, v * h * 0.35);
    }
  }
  // glass glare
  const g = ctx.createLinearGradient(x, y, x + w * 0.6, y + h);
  g.addColorStop(0, "rgba(255,255,255,.22)");
  g.addColorStop(0.35, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function mount() {
  // As big as the window allows, leaving room for the bubble and the track.
  const room = innerHeight - 190 - (current ? 96 : 0);
  const next = Math.max(0.6, Math.min(2.2, room / 340, (innerWidth - 40) / 300));
  if (slime && Math.abs(next - scale) < 0.05) return;
  scale = next;
  slime?.destroy();
  const host = document.createElement("div");
  $("home").querySelector(".body")?.remove();
  host.className = "body";
  $("home").prepend(host);
  slime = createSlime(host, { scale, colors: COLORS[cfg.color] ?? COLORS.mint, inside });
  // The canvas keeps headroom for hops; the bubble sits in it instead of above it.
  $("home").style.marginTop = `${-Math.round(scale * 105)}px`;
  slime.emotion(base);
  slime.screen(Boolean(current));
}
let resizeT = 0;
addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(mount, 200);
});

// ── moods, reactions, the bubble ─────────────────────────────────────────────

function mood(name, ms = 3800) {
  if (!slime) return;
  const face = FACE[name] ?? "neutral";
  if (name === "dance") base = "happy";
  if (name === "sleep") base = "sleepy";
  if (name === "idle") base = current ? "happy" : "neutral";
  slime.emotion(face);
  if (name === "ecstatic") slime.hop(320);
  else if (name === "happy" || name === "love") slime.hop(200);
  clearTimeout(moodTimer);
  if (face !== base) moodTimer = setTimeout(() => slime?.emotion(base), ms);
}

function burst(type, n) {
  const set = FX[type] ?? FX.stars;
  const home = $("home").getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const el = document.createElement("span");
    el.className = "p";
    el.textContent = set[i % set.length];
    el.style.left = `${home.width / 2 + (Math.random() - 0.5) * home.width * 0.4}px`;
    el.style.top = `${home.height * 0.45}px`;
    el.style.setProperty("--dx", `${(Math.random() - 0.5) * home.width * 0.9}px`);
    el.style.setProperty("--dy", `${-home.height * (0.35 + Math.random() * 0.4)}px`);
    el.style.setProperty("--r", `${(Math.random() - 0.5) * 60}deg`);
    el.style.animationDelay = `${i * 70}ms`;
    $("fx").append(el);
    setTimeout(() => el.remove(), 2200 + i * 70);
  }
}

let bubbleTimer = 0;
function say({ text, ms, style }) {
  const b = $("bubble");
  b.className = style === "thought" ? "thought" : "";
  b.textContent = text;
  void b.offsetWidth;
  b.classList.add("on");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove("on"), ms);
}

// ── the track ────────────────────────────────────────────────────────────────

function show(track, src) {
  current = track;
  $("track").className = "on";
  $("who").textContent = `${t.ordered} · ${track.nick}`;
  $("title").textContent = track.title;
  $("dur").textContent = clock(track.duration);
  thumb.src = track.thumbnail || "";
  if (track.video) {
    video.src = src;
    video.currentTime = 0;
    video.play().catch(() => {});
  } else {
    video.removeAttribute("src");
    video.load();
  }
  base = "happy";
  mount();
  slime?.screen(true);
}

function hide() {
  current = null;
  $("track").className = "";
  video.pause();
  video.removeAttribute("src");
  video.load();
  base = "neutral";
  slime?.screen(false);
  slime?.emotion(base);
  mount();
}

// The app keeps the time; the picture follows it, like the music overlay does.
function follow() {
  if (!current) return;
  const pos = target.paused ? target.position : target.position + (Date.now() - target.at) / 1000;
  $("pos").textContent = clock(pos);
  $("fill").style.width = current.duration ? Math.min(100, (pos / current.duration) * 100) + "%" : "0";
  if (!current.video || !video.src) return;
  if (target.paused) {
    if (!video.paused) video.pause();
    return;
  }
  if (video.paused) video.play().catch(() => {});
  if (video.seeking || !video.duration) return;
  const want = Math.min(pos, video.duration - 0.1);
  if (Math.abs(video.currentTime - want) > 0.4) video.currentTime = want;
}
setInterval(follow, 250);

// While music plays the slime bobs on its own, a little off the beat like anyone dancing.
setInterval(() => {
  if (current && !target.paused && slime && Math.random() < 0.7) slime.hop(80 + Math.random() * 50);
}, 520);

function note({ nick, title, ok, reason, arg }) {
  const el = document.createElement("div");
  el.className = "note" + (ok ? "" : " no");
  const why = ok ? t[arg] || "" : (t.reason[reason] || reason).replace("$1", arg || "");
  el.innerHTML = '<b></b> <span class="what"></span><span class="why mono"></span>';
  el.querySelector("b").textContent = nick;
  el.querySelector(".what").textContent = title ? "· " + title : "";
  el.querySelector(".why").textContent = why;
  $("notes").append(el);
  while ($("notes").children.length > 3) $("notes").firstElementChild.remove();
  setTimeout(() => el.classList.add("out"), 6500);
  setTimeout(() => el.remove(), 7000);
}

// ── the piggy bank ───────────────────────────────────────────────────────────
// A full jar keeps the stage for a moment before the next bank shows up.

const jar = createJar($("jar"), { shadow: q.get("bg") !== "green" });
let jarHoldUntil = 0;
let jarNext = null;
let jarTimer = 0;
addEventListener("resize", () => jar.resize());

function bank(m) {
  if (Date.now() < jarHoldUntil) {
    jarNext = m;
    return;
  }
  $("jar").classList.toggle("on", Boolean(m.on));
  if (!m.on) return;
  jar.resize();
  jar.set(m);
}

function bankFull(m) {
  $("jar").classList.add("on");
  jar.set({ name: m.name, have: m.goal, goal: m.goal });
  jar.filled();
  jarHoldUntil = Date.now() + 1900;
  clearTimeout(jarTimer);
  jarTimer = setTimeout(() => {
    jarHoldUntil = 0;
    if (jarNext) bank(jarNext);
    jarNext = null;
  }, 1900);
}

// Opened by the app as its music window, this page also plays the track to the stream.
let sound = null;
if (q.has("sound")) import("/channel.js").then((c) => (sound = c.channel({ role: "studio" })));

mount();

function connect() {
  const ws = new WebSocket("ws://" + location.host);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    sound?.(m);
    if (m.kind === "hello" && T[m.lang]) t = T[m.lang];
    else if (m.kind === "pet-cfg") {
      const recolor = m.color !== cfg.color;
      cfg = m;
      document.documentElement.style.setProperty("--c1", (COLORS[cfg.color] ?? COLORS.mint)[0]);
      document.documentElement.style.setProperty("--c2", (COLORS[cfg.color] ?? COLORS.mint)[1]);
      if (recolor) slime?.colors(COLORS[cfg.color] ?? COLORS.mint);
    } else if (m.kind === "pet") {
      if (m.mood) mood(m.mood);
      if (m.fx) burst(m.fx.type, m.fx.n);
      if (m.say) say(m.say);
    } else if (m.kind === "bank") bank(m);
    else if (m.kind === "bank-fill") bankFull(m);
    else if (m.kind === "music-play") show(m.track, m.src);
    else if (m.kind === "music-stop") hide();
    else if (m.kind === "music-sync") {
      if (current && m.uid === current.uid) target = m;
    } else if (m.kind === "music-note") note(m);
    else if (m.kind === "music-queue") {
      const n = m.next?.[0];
      $("next").className = n ? "mono on" : "mono";
      $("next").innerHTML = n ? `${t.next} · <span></span>` : "";
      if (n) $("next").querySelector("span").textContent = `${n.title} (${n.nick})`;
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
