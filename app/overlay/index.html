<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mgi-stream overlay</title>
<style>
  :root { --ink: #f4efe6; --dim: #8b8478; --hot: #e8a33d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    color: var(--ink);
    font-family: Bahnschrift, "Arial Narrow", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    padding: 24px;
    gap: 16px;
  }

  .line {
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;
    align-items: stretch;
    opacity: .4;
    transition: opacity .4s ease;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .9);
  }
  .line .bar { background: rgba(255, 255, 255, .18); min-height: 32px; }
  .line .who {
    font-family: Consolas, monospace;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 3px;
  }
  .line .what { font-size: 27px; font-weight: 300; line-height: 1.18; }

  /* The bar fills as the phrase plays: progress without a widget. */
  .line.live { opacity: 1; }
  .line.live .who { color: var(--hot); }
  .line.live .bar {
    background: linear-gradient(var(--hot), var(--hot)) top / 100% var(--fill, 0%) no-repeat, rgba(255, 255, 255, .18);
  }

  #unlock {
    position: fixed; inset: 0;
    background: rgba(11, 10, 9, .94);
    display: none; place-items: center;
    font-size: 21px; cursor: pointer;
  }
  #unlock.show { display: grid; }
</style>
</head>
<body>

<div id="unlock">click to enable sound</div>

<script>
const audio = new Audio();
const pending = [];
let playing = false;

function row(nick, text) {
  const el = document.createElement("div");
  el.className = "line live";
  el.innerHTML = '<div class="bar"></div><div><div class="who"></div><div class="what"></div></div>';
  el.querySelector(".who").textContent = nick;
  el.querySelector(".what").textContent = text;
  document.body.append(el);
  while (document.body.querySelectorAll(".line").length > 5) document.querySelector(".line").remove();
  return el;
}

function play(item) {
  playing = true;
  const el = row(item.nick, item.text);
  audio.src = "data:audio/mpeg;base64," + item.audio;

  audio.ontimeupdate = () => {
    if (audio.duration) el.style.setProperty("--fill", (audio.currentTime / audio.duration) * 100 + "%");
  };
  audio.onended = audio.onerror = () => {
    el.classList.remove("live");
    playing = false;
    next();
  };

  // OBS allows autoplay; a plain browser tab needs one user gesture first.
  audio.play().catch(() => {
    document.getElementById("unlock").classList.add("show");
    playing = false;
  });
}

function next() {
  if (!playing && pending.length) play(pending.shift());
}

document.getElementById("unlock").onclick = () => {
  document.getElementById("unlock").classList.remove("show");
  audio.play().catch(() => {});
  playing = true;
};

function connect() {
  const ws = new WebSocket("ws://" + location.host);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.kind === "speak") {
      pending.push(m);
      next();
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
