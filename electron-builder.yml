appId: inc.madgod.mgistream
productName: mgi-stream
copyright: Copyright (c) 2026 Mad God Inc

directories:
  output: dist
  buildResources: build

# electron-updater reads latest.yml from the GitHub release; the release
# itself is created by .github/workflows/release.yml, never by the builder.
publish:
  provider: github
  owner: madgodinc
  repo: mgi-stream

files:
  - app/**/*
  - "!**/*.map"
  # koffi (SendInput for the bank actions) ships every platform's binary and
  # its sources; the Windows x64 build is the only one the app loads.
  - "!node_modules/koffi/src/**"
  - "!node_modules/koffi/vendor/**"
  - "!node_modules/koffi/doc/**"
  - "!node_modules/koffi/build/koffi/{darwin,freebsd,linux,openbsd,musl,win32_ia32,win32_arm64}*/**"

# The FFI binary cannot load from inside the asar.
asarUnpack:
  - node_modules/koffi/build/koffi/win32_x64/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: mgi-stream
  # No version in the file name: the download links on the site and in the readme
  # point at releases/latest/download/<name>, which only resolves for a fixed name.
  artifactName: mgi-stream-setup.${ext}

portable:
  artifactName: mgi-stream-portable.${ext}
