name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run icon
      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One call, one release. The marketplace action raced with itself and
      # created two release entries for the same tag, splitting the assets
      # between them; this has no such step to repeat.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/mgi-stream-setup.exe
          dist/mgi-stream-portable.exe
          dist/latest.yml
          --title "mgi-stream ${{ github.ref_name }}"
          --notes "Download **mgi-stream-setup.exe** below and run it. Nothing else has to be on the machine: the app carries its own runtime. The build is not code-signed, so SmartScreen warns once, choose More info and then Run anyway. The portable build skips the installer."
